name: TiMSA Topological Epistasis Engine CI

on:
  push:
    branches: [ "37", "73", "main" ]
  pull_request:
    branches: [ "37", "73", "main" ]

jobs:
  build_and_test_timsa:
    name: Build & Test TiMSA (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: linux
            arch: riscv64
            runner: ubuntu-latest
          - os: macos
            arch: aarch64
            runner: macos-latest
          - os: macos
            arch: x86_64
            runner: macos-13
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Compile Unified BioZig Binaries (ReleaseFast)
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "riscv64" ]; then
            zig build -Dtarget=riscv64-linux-gnu -Doptimize=ReleaseFast
          else
            zig build -Doptimize=ReleaseFast
          fi

      - name: Execute TiMSA Core Mathematical Primitives (Tests)
        if: matrix.arch != 'riscv64'
        run: zig build test

      - name: Verify C++ Network Fusion Kernel Compilation
        if: matrix.arch != 'riscv64'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "Skipping direct g++ on windows-latest step, assuming MSYS2 or Zig CC handling."
          else
            # Ensure the C++ kernel can compile cleanly on the target OS
            g++ -O3 -std=c++17 fuse_network.cpp -o fuse_network_test
            ./fuse_network_test || echo "Requires arguments, expected."
          fi

      - name: End-to-End TiMSA Pipeline Execution (Minimal Dataset)
        if: matrix.arch != 'riscv64'
        shell: bash
        run: |
          # 1. Generate a minimal 5-sequence MSA for the CI test
          cat << 'EOF' > test_msa.fasta
          >seq1
          MAGVTCV
          >seq2
          MAGVTCV
          >seq3
          MAGITCV
          >seq4
          MAGLTCV
          >seq5
          MAGATCV
          EOF
          
          # 2. Execute the Zig TiMSA rigidity engine
          ./zig-out/bin/biozig timsa rigidity -i test_msa.fasta -o rigidity_out.txt
          
          # 3. Execute the C++ Fusion Kernel to fuse topological rigidity with statistical covariance
          ./fuse_network_test rigidity_out.txt final_epistasis.csv
          
          # 4. Verify output generation
          if [ -f "final_epistasis.csv" ]; then
            echo "Pipeline successfully executed. Extracted Epistasis Network:"
            cat final_epistasis.csv
          else
            echo "Pipeline failed to generate the final epistatic fusion map."
            exit 1
          fi
